<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本蜡烛图技术 · 形态与案例图谱 · 盈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FFFFFF'/%3E%3Crect x='4' y='7' width='6' height='12' fill='%23E5484D'/%3E%3Cline x1='7' y1='3' x2='7' y2='7' stroke='%23E5484D' stroke-width='2'/%3E%3Cline x1='7' y1='19' x2='7' y2='29' stroke='%23E5484D' stroke-width='2'/%3E%3Crect x='16' y='13' width='6' height='10' fill='%232F9E63'/%3E%3Cline x1='19' y1='10' x2='19' y2='13' stroke='%232F9E63' stroke-width='2'/%3E%3Cline x1='19' y1='23' x2='19' y2='28' stroke='%232F9E63' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#FAFAFA;
  --line:#ECECEC; --line2:#E0E0E0;
  --text:#171717; --dim:#7E7E7E; --faint:#B8B8B8;
  --up:#E5484D; --down:#2F9E63;
  --topbar:rgba(255,255,255,.92); --backdrop:rgba(24,24,24,.22); --shadow:0 3px 14px rgba(0,0,0,.05);
  --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0F0F13; --surface:#16161B; --surface2:#1C1C23;
  --line:#26262E; --line2:#34343E;
  --text:#EDEDF0; --dim:#9C9CA6; --faint:#6A6A75;
  --up:#F06166; --down:#37B574;
  --topbar:rgba(15,15,19,.88); --backdrop:rgba(0,0,0,.55); --shadow:0 3px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}

/* ---------- 顶部 ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--topbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.04em}
.logo i{font-style:normal}
.chapter-nav-wrap{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0}
.chapter-nav-toggle{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--dim);font-size:12px;padding:7px 11px;white-space:nowrap;transition:.15s}
.chapter-nav-toggle:hover{color:var(--text);border-color:var(--text)}
.chapter-nav-toggle .triangle{font-size:14px;line-height:1}
.chapter-nav-wrap.collapsed{align-items:center}
.chapter-nav-wrap.collapsed .topnav{display:none}
.topnav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;min-width:0}
.tchip{background:transparent;border:none;color:var(--dim);font-size:13.5px;padding:7px 12px;border-radius:8px;border-bottom:2px solid transparent;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.tchip::before{content:'▾';font-size:14px;line-height:1;color:var(--faint);transition:transform .15s,color .15s}
.tchip[aria-expanded="false"]::before{content:'▸';color:var(--dim)}
.tchip:hover{color:var(--text);background:var(--surface2)}
.tchip.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.theme-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--dim);font-size:13px;padding:7px 13px;border-radius:999px;transition:.15s;white-space:nowrap}
.theme-toggle:hover{color:var(--text);border-color:var(--text)}
.theme-toggle svg{width:14px;height:14px;flex:none}

/* ---------- hero ---------- */
.hero{max-width:1120px;margin:0 auto;padding:64px 20px 40px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--faint);margin-bottom:16px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(32px,5.5vw,54px);line-height:1.16;letter-spacing:.01em}
.hero p{margin-top:16px;max-width:640px;color:var(--dim);font-size:15px}
.hero .meta{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px 0}
.hero .meta span{font-size:13px;color:var(--dim);padding-right:26px;margin-right:26px;border-right:1px solid var(--line)}
.hero .meta span:last-child{border-right:none;padding-right:0;margin-right:0}
.hero .meta b{color:var(--text);font-weight:700;font-size:15px}
.findbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.findbar label{flex:2 1 240px}.findbar input,.findbar select{width:100%;min-height:42px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);color:var(--text);padding:8px 12px;font:14px var(--sans)}
.findbar select{flex:1 1 130px}.findbar input:focus-visible,.findbar select:focus-visible{outline:2px solid #3286df;outline-offset:2px}
.find-count{font-size:13px;color:var(--dim);margin-top:10px}
.empty-search{max-width:1120px;margin:28px auto;padding:30px 20px;text-align:center;color:var(--dim)}

/* ---------- 章节 ---------- */
.chapter{max-width:1120px;margin:0 auto;padding:40px 20px 6px}
.ch-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.ch-num{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em}
.ch-head h2{font-family:var(--serif);font-weight:900;font-size:22px}
.ch-head .en{font-size:12px;color:var(--faint);font-family:var(--mono)}
.ch-head .count{margin-left:0;font-size:12px;color:var(--faint);font-family:var(--mono)}
.chapter-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--dim);font-size:12px;padding:5px 10px;white-space:nowrap}
.chapter-toggle:hover{color:var(--text);border-color:var(--text)}
.chapter-toggle .triangle{font-size:14px;line-height:1;transition:transform .15s}
.chapter.collapsed .chapter-toggle .triangle{transform:rotate(-90deg)}
.chapter-body[hidden]{display:none}
.ch-note{font-size:13px;color:var(--faint);margin:0 0 22px;max-width:720px}

/* ---------- 网格 ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;flex-direction:column;text-align:left;color:inherit;min-width:0}
.cell:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-1px)}
.cell:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.cell .cv{width:100%;height:132px;display:block;margin-bottom:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.cell .cv svg{width:100%;height:100%;display:block}
.cell .title-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:9px;width:100%}
.cell .title-row .tag{white-space:nowrap;line-height:20px}
.cell .cn{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:26px;min-width:0}
.tag{font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);background:var(--surface2)}
.tag.up{color:var(--up);border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.06)}
.tag.down{color:var(--down);border-color:rgba(47,158,99,.35);background:rgba(47,158,99,.06)}
.tag.neu{color:var(--dim)}
.cell .ds{font-size:12.5px;color:var(--dim);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .lesson-cover{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:27px;font-family:var(--serif);font-weight:800;color:var(--text)}
.lesson-cover small{font:12px var(--mono);letter-spacing:.12em;color:var(--faint)}
.lesson-cover svg{width:100%;height:100%}

/* ---------- 详情弹层 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.backdrop{position:absolute;inset:0;background:var(--backdrop)}
.panel{position:relative;width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 30px;box-shadow:0 24px 64px var(--shadow)}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--dim);font-size:20px;display:flex;align-items:center;justify-content:center}
.close:hover{border-color:var(--text);color:var(--text)}
.m-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.m-top .ch{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
.m-top h2{font-family:var(--serif);font-size:26px;font-weight:900}
.m-tags{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 6px}
.m-candle{width:100%;height:210px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0}
.m-candle[hidden]{display:none}
.m-candle svg{width:100%;height:100%}
.m-sec{font-size:11px;color:var(--faint);letter-spacing:.14em;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.m-sec::before{content:"";width:20px;height:1px;background:var(--line2)}
.m-body p{color:var(--dim);font-size:14.5px;margin-bottom:10px}
.m-body h3{font-size:15px;margin:18px 0 5px;color:var(--text)}
.m-body .lesson-intro{color:var(--text);font-size:15px}
.lesson-source{color:var(--dim);font-size:13px}
.m-note{background:var(--surface2);border-radius:10px;padding:14px 16px;font-size:13.5px;color:var(--text)}
.case{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.case .ct{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--faint);margin-bottom:8px}
.case .ct b{color:var(--text);font-weight:600;font-family:var(--mono)}
.case .chart-frame{position:relative;margin:12px 0}
.chart-readout{font-size:12px;line-height:1.5;color:var(--text);min-height:38px;padding:7px 10px;margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.case .case-chart{width:100%;height:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto}
.case .case-chart:focus-visible{outline:2px solid #3286df;outline-offset:2px}
.case .case-chart.with-subchart{height:390px}
.case .case-chart svg{width:100%;height:100%;display:block;margin:0 auto}
.chart-crosshair{position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none;display:none;z-index:2}
.chart-crosshair.active{display:block}
.chart-crosshair .cross-v,.chart-crosshair .cross-h{position:absolute;opacity:.85}
.chart-crosshair .cross-v{left:var(--cross-x);top:0;bottom:0;border-left:1px dashed #3286df}
.chart-crosshair .cross-h{top:var(--cross-y);left:0;right:0;border-top:1px dashed #3286df}
.chart-crosshair .cross-price,.chart-crosshair .cross-date{position:absolute;background:#2871bd;color:white;border-radius:3px;padding:1px 4px;font:11px var(--mono);white-space:nowrap}
.chart-crosshair .cross-price{right:2px;top:var(--cross-y);transform:translateY(-50%)}
.chart-crosshair .cross-date{bottom:2px;left:var(--cross-x);transform:translateX(-50%)}
.chart-controls{position:absolute;right:16px;bottom:16px;display:flex;gap:5px;padding:4px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow)}
.chart-controls{z-index:3}
.chart-controls button{width:32px;height:32px;border:1px solid var(--line2);border-radius:7px;background:var(--surface2);color:var(--text);font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer}
.chart-controls button:hover{border-color:var(--text)}
.chart-controls button:disabled{opacity:.4;cursor:default}
.chart-controls [data-chart-zoom="reset"]{width:42px;font-size:12px;font-weight:700}
.case p{color:var(--dim);font-size:14px;margin:0}
.case .chart-label{font-size:12px;font-weight:700;color:var(--text);margin-top:12px}
.case .chart-hint{font-size:12px;color:var(--dim);margin:4px 0 8px}
.rsi-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0;font-size:12px;font-weight:700}.rsi-legend .curve{color:#1686d9}.rsi-legend .high{color:#cf424a}.rsi-legend .low{color:#258d68}.rsi-legend .trend{color:#7659b8}
.case .mark-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.case .mark-list span{font-size:12px;color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:4px 8px}
.case .mark-list b{color:#3B82F6;margin-right:4px}

/* ---------- 案例双图布局 ---------- */
.case-figs{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;min-width:0}
.case-fig{min-width:0}
@media(min-width:900px){.case-figs.two{grid-template-columns:1fr 1fr;gap:24px}}
@media(min-width:900px){.case-figs.three .case-fig:last-child{grid-column:1/-1}}
.fig-cap{font-size:14px;color:var(--text);font-weight:600;margin:2px 0 0;line-height:1.55}

/* ---------- SVG 图表主题色（内联 SVG 随 data-theme 切换） ---------- */
.kv-wick{stroke-width:1.6;stroke-linecap:round}
.kv-body{stroke-width:0}
.kv-up{fill:var(--up);stroke:var(--up)}
.kv-down{fill:var(--down);stroke:var(--down)}
.kv-neutral{fill:var(--dim);stroke:var(--dim)}
.kv-grid{stroke:var(--line);stroke-width:1}
.kv-tick{fill:var(--faint);font-size:10px;font-family:var(--mono)}
.kv-date{fill:var(--faint);font-size:10.5px}
.kv-sup{stroke:#3B82F6;stroke-width:1.6}
.kv-res{stroke:#F59E0B;stroke-width:1.6}
.kv-tline{stroke:#9CA3AF;stroke-width:1.4;stroke-dasharray:5 4}
html[data-theme="dark"] .kv-sup{stroke:#60A5FA}
html[data-theme="dark"] .kv-res{stroke:#FBBF24}
html[data-theme="dark"] .kv-tline{stroke:#8E8E99}
.kv-tlab{font-size:13px;stroke:none;font-weight:700}
.kv-tlab.kv-sup{fill:#3B82F6}
.kv-tlab.kv-res{fill:#F59E0B}
.kv-tlab.kv-tline{fill:var(--dim)}
html[data-theme="dark"] .kv-tlab.kv-sup{fill:#60A5FA}
html[data-theme="dark"] .kv-tlab.kv-res{fill:#FBBF24}
.kv-markdot{fill:#3B82F6}
.kv-marklab{fill:var(--text);font-size:16px;font-weight:800;paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.kv-gap{fill:rgba(59,130,246,.2);stroke:#3B82F6;stroke-width:1}
.kv-ma-fast{fill:none;stroke:#1686d9;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kv-ma-slow{fill:none;stroke:#e18a00;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kv-ind-main{fill:none;stroke:#1686d9;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kv-ind-signal{fill:none;stroke:#e18a00;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kv-rsi-high{stroke:#cf424a;stroke-width:1.8;stroke-dasharray:7 4}.kv-rsi-low{stroke:#258d68;stroke-width:1.8;stroke-dasharray:7 4}
.kv-rsi-high-label{fill:#b93039}.kv-rsi-low-label{fill:#197550}.kv-rsi-label{font-size:12px;font-weight:800;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.kv-rsi-trend{stroke:#7659b8;stroke-width:1.8;stroke-dasharray:5 4}.kv-rsi-trend-label{fill:#7659b8;font-size:11px;font-weight:800;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.kv-ind-hist-up{fill:#30a46c;opacity:.8}.kv-ind-hist-down{fill:#ef4d52;opacity:.8}
.kv-volume-up{fill:var(--up);opacity:.78}.kv-volume-down{fill:var(--down);opacity:.78}
.kv-panel-label{fill:var(--dim);font-size:11px;font-weight:700}.kv-panel-grid{stroke:var(--line2);stroke-width:1;stroke-dasharray:4 4}
.scheme-trend{fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scheme-guide{stroke:var(--dim);stroke-width:1.5;stroke-dasharray:5 4}
.scheme-text{font:12px var(--sans);fill:var(--dim)}
.scheme-gap{fill:rgba(59,130,246,.12);stroke:rgba(59,130,246,.55);stroke-width:1}

footer{border-top:1px solid var(--line);margin-top:52px;padding:32px 20px 56px;text-align:center;color:var(--faint);font-size:12px}
footer b{color:var(--dim);font-weight:500}

@media(min-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(4,1fr)}}

.site-switcher{display:flex;gap:6px;align-items:center;margin-left:auto}.site-switcher a{display:inline-flex;align-items:center;min-height:32px;padding:6px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--dim);font-size:12px;text-decoration:none;transition:.15s}.site-switcher a:hover,.site-switcher a.active{color:var(--text);border-color:var(--text)}
@media(max-width:700px){.site-switcher{order:3;width:100%;margin-left:0}.site-switcher a{flex:1;justify-content:center}.chapter-nav-wrap{order:4;flex:0 0 100%;width:100%;display:block}.chapter-nav-toggle{width:100%;justify-content:center}.topnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:8px 0 0;max-height:50vh;overflow:auto}.tchip{justify-content:flex-start;min-width:0;text-align:left}}
body.auth-pending{visibility:hidden!important}
body.auth-pending::before{content:'正在验证账号并加载图谱…';visibility:visible;position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--dim);font-size:15px}
</style>
</head>

<nav class="topbar">

    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span id="themeLabel">深色</span>
    </button>
    <div class="chapter-nav-wrap" id="chapterNavWrap">
      <button class="chapter-nav-toggle" id="chapterNavToggle" type="button" aria-expanded="true" aria-controls="topnav"><span class="triangle" aria-hidden="true">▾</span><span class="chapter-nav-label">章节选择</span></button>
      <div class="topnav" id="topnav">
      <button class="tchip" data-goto="ch01">第一章 引论</button>

      <button class="tchip" data-goto="ch10">第十章 汇聚</button>

function schematicSVG(p,detail=false){
  const arr=schematicFor(p),W=380,H=160;
  const y=v=>143-1.22*v;
  const step=Math.min(66,260/arr.length),start=(W-step*arr.length)/2;
  const x=i=>start+step*(i+.5);
  const bw=Math.min(42,step*.64);
  const before=p.sig==='看涨'||/bottom|bot|southern|inverted-hammer/.test(p.id);
  const after=p.sig==='看跌'||/top|northern/.test(p.id);
  const trendEnd=x(0)-step*.55;
  const trendY=before?104:(after?62:83);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${p.cn}形态示意图">`;
  if(!['ch11','ch13','ch14','ch15'].includes(p.ch)&&p.id!=='bar-chart')s+=`<path class="scheme-trend" d="M 16 ${before?34:after?119:72} L 38 ${before?53:after?100:83} L 50 ${before?46:after?107:76} L ${trendEnd} ${trendY}"/>`;
  if(detail&&p.id==='dark-cloud'){
    const mid=(arr[0][0]+arr[0][3])/2;
    s+=`<line class="scheme-guide" x1="${x(0)+bw/2}" y1="${y(mid)}" x2="${x(1)+32}" y2="${y(mid)}"/><text class="scheme-text" x="${x(1)+34}" y="${y(mid)+4}">前阳线中点</text>`;
  }
  if(detail&&/window|gap|tasuki/.test(p.id)&&arr.length>1){
    const a=arr[0],b=arr[1];
    const gap=b[2]>a[1]?[b[2],a[1]]:(b[1]<a[2]?[a[2],b[1]]:null);
    if(gap)s+=`<rect class="scheme-gap" x="${x(0)+bw/2+3}" y="${y(gap[0])}" width="${Math.max(8,x(1)-x(0)-bw-6)}" height="${y(gap[1])-y(gap[0])}"/>`;
  }
  arr.forEach((c,i)=>{
    const cx=x(i),cls=c[3]>c[0]?'kv-up':(c[3]<c[0]?'kv-down':'kv-neutral');
    s+=`<line class="kv-wick ${cls}" x1="${cx}" y1="${y(c[1])}" x2="${cx}" y2="${y(c[2])}"/>`;
    if(p.id==='bar-chart')s+=`<line class="kv-wick ${cls}" x1="${cx-bw/2}" y1="${y(c[0])}" x2="${cx}" y2="${y(c[0])}"/><line class="kv-wick ${cls}" x1="${cx}" y1="${y(c[3])}" x2="${cx+bw/2}" y2="${y(c[3])}"/>`;
    else{const top=Math.min(y(c[0]),y(c[3])),height=Math.max(Math.abs(y(c[3])-y(c[0])),3);s+=`<rect class="kv-body ${cls}" x="${cx-bw/2}" y="${top}" width="${bw}" height="${height}"/>`;}
  });
  if(p.ch==='gA'&&['on-neck','in-neck','thrusting'].includes(p.id)){
    const prior=arr[0],level=p.id==='on-neck'?prior[2]:p.id==='in-neck'?prior[3]:(prior[0]+prior[3])/2;
    s+=`<line class="scheme-guide" x1="${x(0)-bw/2}" y1="${y(level)}" x2="${x(1)+bw/2}" y2="${y(level)}"/>`;
  }
  if(p.ch==='gB'&&p.id==='trendline')s+=`<line class="kv-tline" x1="${x(0)}" y1="${y(34.5)}" x2="${x(arr.length-1)}" y2="${y(36)}"/>`;
  if(p.ch==='gB'&&p.id==='support-resistance')s+=`<line class="kv-sup" x1="50" y1="${y(34.5)}" x2="330" y2="${y(34.5)}"/><line class="kv-res" x1="50" y1="${y(37)}" x2="330" y2="${y(37)}"/>`;
  if((p.ch==='gB'&&['breakout','gaps','island','consolidation','double'].includes(p.id))||p.id==='box-range'){
    const level=p.id==='breakout'?36.2:(p.id==='gaps'||p.id==='island'?arr[0][1]:p.id==='double'?34.1:36.5);
    s+=`<line class="scheme-guide" x1="50" y1="${y(level)}" x2="330" y2="${y(level)}"/>`;
  }
  if(p.ch==='ch11'){
    const line=p.id==='tl-basics'?'<line x1="65" y1="111" x2="315" y2="65"/>':
      p.id==='upthrust'?'<line x1="65" y1="58" x2="315" y2="58"/>':'<line x1="65" y1="108" x2="315" y2="108"/>';
    s+=`<g class="kv-sup">${line}</g>`;
  }
  if(p.ch==='ch13')s+='<path class="kv-ma-fast" d="M 55 109 C 90 104 108 88 140 92 S 198 65 230 79 S 285 62 325 57"/><path class="kv-ma-slow" d="M 55 120 C 105 115 140 103 180 99 S 255 89 325 78"/>';
  if(p.ch==='ch14'){
    if(p.id==='rsi')s+='<line class="kv-rsi-high" x1="55" y1="128" x2="325" y2="128"/><line class="kv-rsi-low" x1="55" y1="148" x2="325" y2="148"/><path class="kv-ind-main" d="M 55 141 C 80 138 94 126 113 130 S 150 148 177 137 S 210 126 230 135 S 267 149 290 142 S 312 135 325 139"/><text class="kv-rsi-label kv-rsi-high-label" x="330" y="131">70</text><text class="kv-rsi-label kv-rsi-low-label" x="330" y="151">30</text>';
    else s+='<line class="kv-panel-grid" x1="55" y1="125" x2="325" y2="125"/><path class="kv-ind-main" d="M 55 139 C 85 136 95 147 125 139 S 168 124 195 133 S 239 149 266 138 S 300 128 325 132"/>';
  }
  if(p.ch==='ch15')s+=`<g class="kv-volume-up">${arr.map((_,i)=>`<rect x="${x(i)-bw/2}" y="${i===1?118:(i===0?133:137)}" width="${bw}" height="${i===1?32:(i===0?17:13)}"/>`).join('')}</g><line class="kv-grid" x1="65" y1="151" x2="315" y2="151"/>`;
  return s+'</svg>';
}

/* ---- 带坐标系的完整案例图 ---- */
let _svgUid=0;
function niceTicks(lo,hi,count){
  const span=(hi-lo)||1;
  const raw=span/count,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=raw/mag;
  if(step>=5)step=5;else if(step>=2)step=2;else step=1;
  step*=mag;
  const ticks=[];
  for(let t=Math.ceil(lo/step)*step;t<=hi+step*1e-6;t+=step)ticks.push(t);
  return ticks;
}
function fmtPrice(v){
  return Number(v.toFixed(Math.abs(v)<10?4:(Math.abs(v)<100?2:1))).toString();
}
function sma(values,period){
  return values.map((_,i)=>i<period-1?null:values.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period);
}
function ema(values,period){
  let previous=values[0]||0;
  return values.map((v,i)=>previous=i?previous+(v-previous)*2/(period+1):v);
}
function indicatorSeries(candles,type){
  const closes=candles.map(c=>c[3]);
  if(type==='rsi'){
    const period=9;
    const main=closes.map((_,i)=>{
      if(i<period)return null;
      let gains=0,losses=0;
      for(let j=i-period+1;j<=i;j++){const d=closes[j]-closes[j-1];gains+=Math.max(d,0);losses+=Math.max(-d,0);}
      return losses===0?100:100-100/(1+gains/losses);
    });
    return {name:'RSI(9)',main,bounds:[0,100],guides:[30,70]};
  }
  if(type==='stochastics'){
    const raw=candles.map((c,i)=>{
      if(i<4)return null;
      const part=candles.slice(i-4,i+1);
      const low=Math.min(...part.map(v=>v[2])),high=Math.max(...part.map(v=>v[1]));
      return high===low?50:(c[3]-low)/(high-low)*100;
    });
    const average=(arr,i)=>{const a=arr.slice(i-2,i+1);return a.length<3||a.some(v=>v===null)?null:a.reduce((x,y)=>x+y,0)/3;};
    const main=raw.map((_,i)=>average(raw,i));
    return {name:'随机指数 %K / %D（5期示意）',main,signal:main.map((_,i)=>average(main,i)),bounds:[0,100],guides:[20,80]};
  }
  if(type==='macd'){
    const fast=ema(closes,12),slow=ema(closes,26);
    const main=fast.map((v,i)=>v-slow[i]);
    return {name:'MACD(12,26,9)',main,signal:ema(main,9),guides:[0]};
  }
  if(type==='ma-osc'){
    const fast=sma(closes,5),slow=sma(closes,10);
    return {name:'均线摆动指数(5−10)',main:fast.map((v,i)=>v===null||slow[i]===null?null:v-slow[i]),guides:[0]};
  }
  const period=Math.min(5,Math.max(2,Math.floor(closes.length/3)));
  return {name:`动力指数(${period})`,main:closes.map((v,i)=>i<period?null:v-closes[i-period]),guides:[0]};
}
// The source book identifies signal positions, but does not supply a downloadable

function studyCurve(n,anchors){
  return Array.from({length:n},(_,i)=>{
    let a=anchors[0],b=anchors[anchors.length-1];
    for(let j=0;j<anchors.length-1;j++)if(i>=anchors[j][0]&&i<=anchors[j+1][0]){a=anchors[j];b=anchors[j+1];break;}
    return a[1]+(b[1]-a[1])*(b[0]===a[0]?0:(i-a[0])/(b[0]-a[0]));
  });
}

function volumeSeries(candles,marks){
  const values=candles.map((c,i)=>.72+Math.abs(c[3]-c[0])/Math.max(.01,c[1]-c[2])*.38+(i%5)*.09);
  (marks||[]).forEach(m=>{
    const i=Math.round(m.x),label=m.label||'';
    if(i<0||i>=values.length)return;
    if(/前纺锤线量轻、后长白量重|黑线量轻、白线量重/.test(label)&&i>0){values[i-1]=.38;values[i]=2.3;}
    if(/巨量|超级|井喷|放量|格外重大|超大/.test(label))values[i]=2.8;

  });

}

function caseChartSVG(series,opts){

  const x=i=>padL+(i+0.5)*step;

  });
  if(opts.showGaps){
    for(let i=1;i<series.length;i++){
      const a=series[i-1],b=series[i];
      const gap=b[2]>a[1]?[b[2],a[1]]:(b[1]<a[2]?[a[2],b[1]]:null);
      if(!gap)continue;
      const gx=x(i-1)+bw/2+2,gw=Math.max(4,x(i)-x(i-1)-bw-4);

    if(t.label){

      const mx=Math.min(Math.max((x1+x2)/2,minX+half+4),maxX-half-4),my=Math.min(Math.max((y1+y2)/2,minY+10),maxY-6);

      if(rsi)s+=`<text class="kv-rsi-label ${v===70?'kv-rsi-high-label':'kv-rsi-low-label'}" x="${W-padR-5}" y="${iy(v)-4}" text-anchor="end">${v} ${v===70?'超买':'超卖'}</text>`;
    });
    if(ind.trendLine){
      const {from,to}=ind.trendLine;
      s+=`<line class="kv-rsi-trend" x1="${x(from[0])}" y1="${iy(from[1])}" x2="${x(to[0])}" y2="${iy(to[1])}"/><text class="kv-rsi-trend-label" x="${x(to[0])+4}" y="${iy(to[1])-5}">RSI趋势线</text>`;

    }

  }

}

      </div>
      <div class="chapter-body" id="${ch.id}-body">
        <p class="ch-note">${ch.note}</p>
        <div class="grid" style="margin-top:18px">${list.map(cardHTML).join('')}</div>
      </div>
    </section>`;
  }).join('')||(filtering?'<p class="empty-search">没有找到匹配的条目，请换个关键词或筛选条件。</p>':'');
}
function cardHTML(p){
  const s=p.sig==='看涨'?'up':(p.sig==='看跌'?'down':'neu');
  const visual=p.lesson?`<span class="cv lesson-cover">${lessonDiagram(p)||`<small>${CHAPTERS.find(c=>c.id===p.ch)?.num||''}</small><span>${p.cn}</span>`}</span>`:`<span class="cv">${schematicSVG(p)}</span>`;
  return `<button class="cell" data-id="${p.id}" aria-label="查看 ${p.cn} 详情">
    ${visual}
    <span class="title-row"><span class="tag">${p.kind}</span><span class="cn">${p.cn}</span>${p.sig?`<span class="tag ${s}">${p.sig}</span>`:''}</span>
    <span class="ds">${p.desc}</span>
  </button>`;
}
function tagHTML(p){
  const s=p.sig==='看涨'?'up':(p.sig==='看跌'?'down':'neu');
  const ch=CHAPTERS.find(c=>c.id===p.ch);
  return `${p.sig?`<span class="tag ${s}">${p.sig}</span>`:''}<span class="tag">${p.kind}</span><span class="tag">${ch?ch.num:p.ch}</span>`;
}
function openModal(id){
  const p=PATTERNS.find(x=>x.id===id); if(!p)return;
  const ch=CHAPTERS.find(c=>c.id===p.ch);
  document.getElementById('mCh').textContent=(ch?ch.num+' '+ch.name:'');
  document.getElementById('mTitle').textContent=p.cn;
  document.getElementById('mTags').innerHTML=tagHTML(p);
  document.getElementById('mDefinitionLabel').textContent=p.lesson?'内容梳理':'形态定义';
  document.getElementById('mNoteLabel').textContent=p.lesson?'记住这一点':'识别要点';
  document.getElementById('mCaseLabel').textContent=p.lesson?'书中位置':'图例与说明';
  const diagram= p.lesson?lessonDiagram(p,true):schematicSVG(p,true);
  document.getElementById('mCandle').hidden=Boolean(p.lesson&&!diagram);
  document.getElementById('mCandle').innerHTML=diagram;
  document.getElementById('mBody').innerHTML=p.lesson?`<p class="lesson-intro">${p.def}</p>${(p.sections||[]).map(s=>`<h3>${s.title}</h3><p>${s.body}</p>`).join('')}`:`<p>${p.def}</p>`;
  document.getElementById('mNote').textContent=p.note;
  if(p.lesson){
    document.getElementById('mCase').innerHTML=`<p class="lesson-source">${p.source||''}</p>`;
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow='hidden';
    return;
  }
  const cs1=p.case||{};
  const figs=[caseFigHTML({id:p.id,ch:p.ch,cn:p.cn,focus:p.focus,candle:p.candle,trend:p.trend,marks:p.marks,dates:p.dates,fig:p.fig,t:cs1.t,f:cs1.f,d:cs1.d,c:cs1.c})];
  if(p.case2)figs.push(caseFigHTML({id:p.id,ch:p.ch,cn:p.cn,candle:p.case2.candle,trend:p.case2.trend,marks:p.case2.marks,dates:p.case2.dates,fig:p.case2.fig,t:p.case2.t,f:p.case2.f,d:p.case2.d,c:p.case2.c}));
  if(p.case3)figs.push(caseFigHTML({id:p.id,ch:p.ch,cn:p.cn,candle:p.case3.candle,trend:p.case3.trend,marks:p.case3.marks,dates:p.case3.dates,fig:p.case3.fig,t:p.case3.t,f:p.case3.f,d:p.case3.d,c:p.case3.c,noDetail:true}));
  document.getElementById('mCase').innerHTML=`<div class="case-figs${p.case2?' two':''}${p.case3?' three':''}">${figs.join('')}</div>`;
  document.getElementById('modal').classList.add('open');
  document.querySelectorAll('#mCase .chart-frame').forEach(frame=>{
    const chart=frame.querySelector('.case-chart'),svg=chart.querySelector('svg');
    frame.dataset.baseWidth=String(Math.max(620,chart.clientWidth-16));
    frame.dataset.scale='1';
    svg.style.width=frame.dataset.baseWidth+'px';
    frame.querySelector('[data-chart-zoom="reset"]').disabled=true;
  });
  document.querySelectorAll('#mCase .case-fig').forEach(fig=>{
    const zoom=fig.querySelector('.case-chart');
    if(zoom&&fig.querySelectorAll('.case-chart').length>1)zoom.scrollLeft=(zoom.scrollWidth-zoom.clientWidth)/2;
  });
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';}
function zoomChart(button){
  const frame=button.closest('.chart-frame'),chart=frame.querySelector('.case-chart'),svg=chart.querySelector('svg');
  const oldScale=Number(frame.dataset.scale)||1;
  const next=button.dataset.chartZoom==='reset'?1:Math.min(2.5,Math.max(.25,Math.round((oldScale+(button.dataset.chartZoom==='in'?.15:-.15))*100)/100));
  if(next===oldScale)return;
  const center=(chart.scrollLeft+chart.clientWidth/2)/svg.getBoundingClientRect().width;
  frame.dataset.scale=String(next);
  svg.style.width=Math.round(Number(frame.dataset.baseWidth)*next)+'px';
  chart.scrollLeft=center*svg.getBoundingClientRect().width-chart.clientWidth/2;
  frame.querySelector('[data-chart-zoom="in"]').disabled=next>=2.5;
  frame.querySelector('[data-chart-zoom="out"]').disabled=next<=.25;
  frame.querySelector('[data-chart-zoom="reset"]').disabled=next===1;
}
const chartDataCache=new WeakMap();
function chartData(svg){
  if(!chartDataCache.has(svg))chartDataCache.set(svg,{
    dates:JSON.parse(decodeURIComponent(svg.dataset.dates)),
    series:JSON.parse(decodeURIComponent(svg.dataset.series)),
    indicator:JSON.parse(decodeURIComponent(svg.dataset.indicator)),
    volume:JSON.parse(decodeURIComponent(svg.dataset.volume))
  });
  return chartDataCache.get(svg);
}
function updateChartReadout(chart,index){
  const frame=chart.closest('.chart-frame'),svg=chart.querySelector('svg'),data=chartData(svg);
  const candle=data.series[index];if(!candle)return;
  const parts=[data.dates[index]||`第${index+1}根`,`开 ${fmtPrice(candle[0])}`,`高 ${fmtPrice(candle[1])}`,`低 ${fmtPrice(candle[2])}`,`收 ${fmtPrice(candle[3])}`];
  const indicator=data.indicator;
  if(indicator){
    const value=indicator.main?.[index];
    if(Number.isFinite(value))parts.push(`${indicator.name||'指标'} ${fmtPrice(value)}`);
    const signal=indicator.signal?.[index];
    if(Number.isFinite(signal))parts.push(`信号线 ${fmtPrice(signal)}`);
  }
  if(Number.isFinite(data.volume?.[index]))parts.push(`相对成交量 ${fmtPrice(data.volume[index])}`);
  frame.previousElementSibling.textContent=parts.join('  ·  ')+'（示意）';
  chart.dataset.selectedIndex=String(index);
}
function moveChartCrosshair(chart,clientX,clientY){
  const frame=chart.closest('.chart-frame'),overlay=frame.querySelector('.chart-crosshair');
  const rect=frame.getBoundingClientRect(),svg=chart.querySelector('svg'),svgRect=svg.getBoundingClientRect();
  if(clientX<rect.left||clientX>rect.right||clientY<rect.top||clientY>rect.bottom){overlay.classList.remove('active');return;}
  overlay.style.setProperty('--cross-x',`${clientX-rect.left}px`);
  overlay.style.setProperty('--cross-y',`${clientY-rect.top}px`);
  overlay.classList.add('active');
  const vb=svg.viewBox.baseVal;
  const sx=(clientX-svgRect.left)/svgRect.width*vb.width;
  const sy=(clientY-svgRect.top)/svgRect.height*vb.height;
  const plotStart=Number(svg.dataset.padLeft),plotWidth=Number(svg.dataset.plotWidth);
  const count=Number(svg.dataset.count),index=Math.max(0,Math.min(count-1,Math.round((sx-plotStart)/plotWidth*count-.5)));
  const dates=chartData(svg).dates;
  overlay.querySelector('.cross-date').textContent=dates[index]||`第${index+1}根`;
  const price=overlay.querySelector('.cross-price'),top=Number(svg.dataset.padTop),height=Number(svg.dataset.plotHeight);
  price.textContent=sy>=top&&sy<=top+height?fmtPrice(Number(svg.dataset.hi)-(sy-top)/height*(Number(svg.dataset.hi)-Number(svg.dataset.lo))):'';
  updateChartReadout(chart,index);
}
function selectChartCandle(chart,index){
  const svg=chart.querySelector('svg'),count=Number(svg.dataset.count),i=Math.max(0,Math.min(count-1,index));
  const vb=svg.viewBox.baseVal,plotStart=Number(svg.dataset.padLeft),plotWidth=Number(svg.dataset.plotWidth);
  const x=plotStart+(i+.5)*plotWidth/count;
  const rect=svg.getBoundingClientRect();
  const clientX=rect.left+x/vb.width*rect.width;
  const clientY=rect.top+Number(svg.dataset.padTop)/vb.height*rect.height+24;
  chart.scrollLeft+=clientX-(chart.getBoundingClientRect().left+chart.clientWidth/2);
  const adjusted=svg.getBoundingClientRect();
  moveChartCrosshair(chart,adjusted.left+x/vb.width*adjusted.width,clientY);
}

/* ---- 事件 ---- */
function setChapterOpen(id, open, shouldScroll){
  const el=document.getElementById(id);
  if(!el)return;
  const body=el.querySelector('.chapter-body');
  const toggle=el.querySelector('[data-chapter-toggle]');
  const nav=document.querySelector('.tchip[data-goto="'+id+'"]');
  el.classList.toggle('collapsed', !open);
  if(body)body.hidden=!open;
  if(toggle){
    toggle.setAttribute('aria-expanded',String(open));
    const label=toggle.querySelector('.toggle-label');
    const triangle=toggle.querySelector('.triangle');
    if(label)label.textContent=open?'折叠':'展开';
    if(triangle)triangle.textContent=open?'▾':'▸';
  }
  if(nav)nav.setAttribute('aria-expanded',String(open));
  if(shouldScroll)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleChapter(id, shouldScroll){
  const el=document.getElementById(id);
  if(!el)return;
  const toggle=el.querySelector('[data-chapter-toggle]');
  const open=!toggle || toggle.getAttribute('aria-expanded')!=='true';
  setChapterOpen(id,open,shouldScroll);
}
const chapterNavWrap=document.getElementById('chapterNavWrap');
const chapterNavToggle=document.getElementById('chapterNavToggle');
chapterNavToggle.addEventListener('click',()=>{
  const collapsed=chapterNavWrap.classList.toggle('collapsed');
  chapterNavToggle.setAttribute('aria-expanded',String(!collapsed));
  chapterNavToggle.querySelector('.triangle').textContent=collapsed?'▸':'▾';
  chapterNavToggle.querySelector('.chapter-nav-label').textContent=collapsed?'展开章节':'章节选择';
});
document.querySelectorAll('.tchip').forEach(b=>{
  b.setAttribute('aria-expanded','true');
  b.addEventListener('click',()=>{
    if(!document.getElementById(b.dataset.goto)){
      document.getElementById('patternSearch').value='';
      document.getElementById('chapterFilter').value='';
      document.getElementById('signalFilter').value='';
      document.getElementById('kindFilter').value='';
      build();
      setChapterOpen(b.dataset.goto,true,true);
    }else toggleChapter(b.dataset.goto,true);
  });
});
document.getElementById('main').addEventListener('click',e=>{
  const toggle=e.target.closest('[data-chapter-toggle]');
  if(toggle)toggleChapter(toggle.dataset.chapterToggle,false);
});
document.getElementById('main').addEventListener('click',e=>{
  const cell=e.target.closest('.cell'); if(cell)openModal(cell.dataset.id);
});
document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',closeModal));
document.getElementById('mCase').addEventListener('click',e=>{
  const button=e.target.closest('[data-chart-zoom]');
  if(button)zoomChart(button);
});
document.getElementById('mCase').addEventListener('pointermove',e=>{
  const chart=e.target.closest('.case-chart');if(chart)moveChartCrosshair(chart,e.clientX,e.clientY);
});
document.getElementById('mCase').addEventListener('pointerdown',e=>{
  const chart=e.target.closest('.case-chart');if(chart)moveChartCrosshair(chart,e.clientX,e.clientY);
});
document.getElementById('mCase').addEventListener('pointerout',e=>{
  if(e.pointerType==='mouse'&&e.target.closest('.case-chart')&&!e.relatedTarget?.closest?.('.case-chart'))e.target.closest('.chart-frame').querySelector('.chart-crosshair').classList.remove('active');
});
document.getElementById('mCase').addEventListener('touchmove',e=>{
  const touch=e.touches[0],chart=e.target.closest('.case-chart');
  if(touch&&chart)moveChartCrosshair(chart,touch.clientX,touch.clientY);
},{passive:true});
document.getElementById('mCase').addEventListener('keydown',e=>{
  const chart=e.target.closest('.case-chart');
  if(!chart||!['ArrowLeft','ArrowRight'].includes(e.key))return;
  e.preventDefault();
  selectChartCandle(chart,(Number(chart.dataset.selectedIndex)||0)+(e.key==='ArrowRight'?1:-1));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('themeToggle').addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});
if(window.matchMedia('(max-width:700px)').matches){
  chapterNavWrap.classList.add('collapsed');
  chapterNavToggle.setAttribute('aria-expanded','false');
  chapterNavToggle.querySelector('.triangle').textContent='▸';
  chapterNavToggle.querySelector('.chapter-nav-label').textContent='展开章节';
}
let catalogueLoaded=false;
window.yingCandleLoad=async function(token){
  if(catalogueLoaded)return;
  const response=await fetch('https://ying-candle-data.shuyaolu93.workers.dev/api/candle/data',{
    cache:'no-store',headers:{authorization:'Bearer '+token}
  });
  if(!response.ok)throw new Error('图谱数据加载失败');
  const data=await response.json();
  if(!Array.isArray(data.patterns)||!data.patterns.length||!data.schematics)throw new Error('图谱数据不完整');
  PATTERNS=data.patterns;
  SCHEMATICS=data.schematics;
  initFilters();
  build();
  catalogueLoaded=true;
};
