<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://ronghe-risk-free.shuyaolu93.workers.dev; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Ying · 管理后台</title>
  <style>
    :root{color-scheme:light;--ink:#29241f;--muted:#736b60;--line:#d8cec0;--paper:#f6f2e9;--card:#fffcf6;--red:#a93a2d;--green:#236d50}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--red)}.wrap{width:min(1200px,calc(100% - 32px));margin:0 auto}.top{border-bottom:1px solid var(--line);background:var(--card)}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}.brand{font:700 22px/1.2 "Songti SC",serif;letter-spacing:.06em}.brand small{display:block;margin-top:5px;color:var(--muted);font:11px/1.4 monospace;letter-spacing:.15em}.top-actions{display:flex;align-items:center;gap:14px;font-size:13px}.top-actions button{border:0;background:transparent;color:var(--red)}main.wrap{padding:30px 0 80px}h1{margin:0 0 8px;font:700 clamp(26px,4vw,36px)/1.2 "Songti SC",serif}h2{margin:0;font:700 21px/1.3 "Songti SC",serif}.sub{margin:0 0 24px;color:var(--muted)}.panel{margin-top:22px;padding:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 28px #29241f09}.login{max-width:480px;margin:60px auto}.login label,.generator label{display:block;margin:14px 0 5px;color:var(--muted);font-size:13px}.login input,.generator input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink)}.primary{border:1px solid var(--ink);border-radius:4px;padding:11px 18px;background:var(--ink);color:white}.secondary{border:1px solid var(--line);border-radius:4px;padding:9px 14px;background:white;color:var(--ink)}.login .primary{width:100%;margin-top:18px}.notice{min-height:22px;margin:12px 0 0;color:var(--red);font-size:13px}.notice.good{color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:19px;background:var(--card);border:1px solid var(--line)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:4px;font:700 27px/1.2 ui-monospace,monospace}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head small{color:var(--muted)}.generator{display:grid;grid-template-columns:repeat(2,minmax(0,180px)) auto;align-items:end;gap:12px}.generator label{margin:0 0 5px}.generator .primary{min-height:44px}.code-result{width:100%;min-height:70px;margin-top:16px;padding:12px;border:1px solid var(--line);background:white;color:var(--ink);resize:vertical}.code-tools{display:flex;align-items:center;justify-content:space-between;gap:12px}.code-tools p{margin:0;color:var(--muted);font-size:12px}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}.data-table th,.data-table td{padding:10px 12px;border-bottom:1px solid #e8e0d5;font-size:13px}.data-table th{background:#f3ede2;color:var(--muted);font-weight:600}.data-table td.message{max-width:400px;white-space:pre-wrap;overflow-wrap:anywhere}.data-table tr:last-child td{border-bottom:0}.empty{padding:16px 12px;color:var(--muted);font-size:13px}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px}.pager span{color:var(--muted);font-size:12px}.muted{color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.generator{grid-template-columns:1fr 1fr}.generator .primary{grid-column:1/-1}}@media(max-width:520px){.top .wrap{align-items:flex-start}.top-actions{flex-direction:column;align-items:flex-end;gap:5px}.panel{padding:17px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:23px}.generator{grid-template-columns:1fr}.generator .primary{grid-column:auto}.code-tools{align-items:flex-start;flex-direction:column}}
  </style>
  <script src="./admin.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap"><div class="brand">盈 · 管理后台<small>YING / CONTROL DESK</small></div><div class="top-actions"><a href="./">返回网站</a><button id="logout" type="button" hidden>退出管理账号</button></div></div></header>
  <main class="wrap">
    <section id="loginPanel" class="panel login">
      <h1>管理员登录</h1><p class="sub">使用已授权的 Ying 管理账号进入。普通账号无法查看后台数据。</p>
      <form id="loginForm"><label for="account">账号</label><input id="account" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">登录后台</button></form>
      <p id="loginNotice" class="notice" role="status" aria-live="polite"></p>
    </section>
    <div id="dashboard" hidden>
      <h1>运营总览</h1><p id="adminIdentity" class="sub"></p>
      <section id="stats" class="stats" aria-label="数据概览"></section>
      <section class="panel"><div class="section-head"><div><h2>生成卡密</h2><small>卡密明文仅在生成时显示，请立即复制保存。</small></div></div>
        <form id="codeForm" class="generator"><div><label for="days">有效天数</label><input id="days" type="number" min="1" max="3650" value="30" required></div><div><label for="count">生成数量</label><input id="count" type="number" min="1" max="100" value="1" required></div><button class="primary" type="submit">生成卡密</button></form>
        <p id="codeNotice" class="notice" role="status" aria-live="polite"></p><textarea id="codeResult" class="code-result" readonly placeholder="生成的卡密会显示在这里"></textarea><div class="code-tools"><p>数据库只保存卡密的校验值，已生成的卡密明文无法找回。</p><button id="copyCodes" class="secondary" type="button" disabled>复制卡密</button></div>
      </section>
      <section id="usersSection" class="panel" data-section="users"><div class="section-head"><h2>账号与云端状态</h2><small>每页 50 条</small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>账号</th><th>卡密到期</th><th>最近登录</th><th>有效会话</th><th>研究记录同步</th><th>蜡烛图同步</th></tr></thead><tbody></tbody></table></div><div class="pager"></div></section>
      <section id="codesSection" class="panel" data-section="codes"><div class="section-head"><h2>卡密使用情况</h2><small>仅展示编号和统计，不展示卡密明文</small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>编号</th><th>有效天数</th><th>兑换次数</th><th>创建时间</th><th>卡密截止</th></tr></thead><tbody></tbody></table></div><div class="pager"></div></section>
      <section id="redemptionsSection" class="panel" data-section="redemptions"><div class="section-head"><h2>兑换记录</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>账号</th><th>卡密编号</th><th>增加天数</th><th>兑换时间</th></tr></thead><tbody></tbody></table></div><div class="pager"></div></section>
      <section id="loginsSection" class="panel" data-section="logins"><div class="section-head"><h2>登录记录</h2><small>从本后台上线后开始记录；不采集登录 IP</small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>账号</th><th>事件</th><th>时间</th></tr></thead><tbody></tbody></table></div><div class="pager"></div></section>
      <section id="messagesSection" class="panel" data-section="messages"><div class="section-head"><h2>用户留言</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>账号</th><th>留言</th><th>时间</th></tr></thead><tbody></tbody></table></div><div class="pager"></div></section>
    </div>
  </main>
</body>
</html>
